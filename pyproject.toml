[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "deskweave"
version = "0.1.0"
description = "Shared application services for DeskWeaveStudio"
readme = "README.en.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Ranzevor"}]
dependencies = ["jsonschema==4.26.0", "referencing==0.36.2", "rfc8785==0.1.4"]

[project.urls]
Repository = "https://github.com/ranzevor/DeskWeaveStudio"
Issues = "https://github.com/ranzevor/DeskWeaveStudio/issues"

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["python/deskweave"]

[tool.hatch.build.targets.wheel.force-include]
contracts = "deskweave/contracts"

[tool.hatch.build.targets.sdist]
include = [
  "/python", "/contracts", "/tests", "/pyproject.toml", "/uv.lock",
  "/README.en.md", "/LICENSE", "/examples/engine",
  "/examples/workflows/hello.json", "/docs/development/engine.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
