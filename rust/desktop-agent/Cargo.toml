[package]
name = "deskweave-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[features]
test-authority = []

[[example]]
name = "agent-test-authority"
required-features = ["test-authority"]
